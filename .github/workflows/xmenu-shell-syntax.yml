name: Xmenu shell syntax

on:
  push:
    paths:
      - "xmenu-v1.0.sh"
      - ".github/workflows/xmenu-shell-syntax.yml"
  pull_request:
    paths:
      - "xmenu-v1.0.sh"
      - ".github/workflows/xmenu-shell-syntax.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate POSIX shell syntax
        run: sh -n xmenu-v1.0.sh
