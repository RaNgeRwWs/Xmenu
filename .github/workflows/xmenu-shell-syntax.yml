name: Xmenu shell syntax

on:
  push:
    paths:
      - "xmenu-v1.0.sh"
      - "tests/**"
      - "strategies/**"
      - "SHA256SUMS"
      - ".github/workflows/xmenu-shell-syntax.yml"
  pull_request:
    paths:
      - "xmenu-v1.0.sh"
      - "tests/**"
      - "strategies/**"
      - "SHA256SUMS"
      - ".github/workflows/xmenu-shell-syntax.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate POSIX shell syntax
        run: sh -n xmenu-v1.0.sh
      - name: Check release and strategy checksums
        run: |
          sha256sum -c SHA256SUMS
          sha256sum -c strategies/nfqws2/SHA256SUMS
          for config in strategies/nfqws2/*.conf; do sh -n "$config"; done
      - name: Install audit tools
        run: sudo apt-get update && sudo apt-get install -y busybox shellcheck openssl
      - name: Audit complete script
        run: shellcheck -s sh -S warning xmenu-v1.0.sh
      - name: Complete release checks including network protocol fixtures
        run: sudo -E python3 tests/run_checks.py
