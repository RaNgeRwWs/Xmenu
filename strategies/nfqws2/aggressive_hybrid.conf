ISP_INTERFACE="eth3"
NFQWS_BASE_ARGS="--lua-init=@/opt/etc/nfqws2/lua/zapret-lib.lua
--lua-init=@/opt/etc/nfqws2/lua/zapret-antidpi.lua
--lua-init=@/opt/etc/nfqws2/lua/zapret-auto.lua
--blob=quic_initial:@/opt/etc/nfqws2/blobs/quic_initial.bin
--blob=tls_clienthello:@/opt/etc/nfqws2/blobs/tls_clienthello.bin
--blob=blob_zero:0x00000000"
NFQWS_ARGS="--filter-tcp=80,443,1984,2053,2083,2087,2096,5222,8443
--filter-l7=tls,http,mtproto
--payload=tls_client_hello,http_req,mtproto_initial
--lua-desync=circular:fails=2:time=300:retrans=3:nld=2
--lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid:ip_autottl=-2,2-10:tcp_seq=-10000:strategy=1
--lua-desync=multisplit:pos=1,midsld:seqovl=1:seqovl_pattern=tls_clienthello:tcp_ts_up:disorder_after:strategy=1
--lua-desync=hostfakesplit:host=google.com:midhost=host-2:altorder=1:seqovl=sniext+3:seqovl_pattern=tls_clienthello:badsum:tcp_md5:tcp_ts_up:disorder_after:strategy=2
--lua-desync=multisplit:pos=sniext:seqovl=10:seqovl_pattern=tls_clienthello:badsum:tcp_md5:tcp_ts_up:disorder_after:strategy=3"
NFQWS_ARGS_QUIC="--filter-udp=443
--filter-l7=quic
--payload=quic_initial
--lua-desync=fake:blob=quic_google:repeats=8"
NFQWS_ARGS_UDP="--filter-udp=590-600,1400,3478-3481,5349,19294-19344,49152-65535
--filter-l7=wireguard,stun,discord,mtproto,unknown
--payload=wireguard_initiation,wireguard_response,wireguard_cookie,stun,discord_ip_discovery,mtproto_initial,unknown
--lua-desync=circular:fails=2:time=300:retrans=3:nld=2
--lua-desync=fake:blob=blob_zero:repeats=4:strategy=1
--lua-desync=fake:blob=quic_initial:repeats=6:ip_ttl=3:strategy=2
--lua-desync=fake:blob=quic_initial:repeats=10:ip_ttl=2:strategy=3"
MODE_LIST="--hostlist=/opt/etc/nfqws2/lists/user.list"
MODE_ALL="--hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list"
MODE_AUTO="$MODE_LIST
--hostlist-auto=/opt/etc/nfqws2/lists/auto.list
--hostlist-auto-debug=/opt/var/log/nfqws2.log
$MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_LIST"
NFQWS_ARGS_IPSET="--ipset=/opt/etc/nfqws2/lists/ipset.list
--ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list"
NFQWS_ARGS_CUSTOM="--filter-tcp=443
--filter-l7=tls
--payload=tls_client_hello
--lua-desync=circular:fails=2:time=300:retrans=3:nld=2
--lua-desync=hostfakesplit:host=google.com:midhost=host-2:seqovl=sniext+3:seqovl_pattern=tls_clienthello:badsum:tcp_md5:tcp_ts_up:strategy=1
--lua-desync=tcpseg:pos=0,1:ip_id=rnd:repeats=4:strategy=2
--lua-desync=fakedsplit:oob:oob_data=0x00:pos=midsld:pattern=0x0F0F0F0F:tcp_seq=0:tcp_ack=-1000:ip_autottl=-2,3-20:repeats=2:strategy=2
--lua-desync=hostfakesplit:host=google.com:nofake2:midhost=midsld:tcp_ack=-66000:tcp_ts_up:disorder_after:strategy=3
--lua-desync=multisplit:pos=sniext:seqovl=10:seqovl_pattern=tls_clienthello:badsum:tcp_md5:tcp_ts_up:disorder_after:strategy=3"
IPV6_ENABLED=0
TCP_PORTS=80,443,1984,2053,2083,2087,2096,5222,8443
UDP_PORTS=443,590:600,1400,3478:3481,5349,19294:19344,49152:65535
POLICY_NAME="nfqws"
POLICY_EXCLUDE=0
LOG_LEVEL=0
NFQUEUE_NUM=300
USER=nobody
CONFIG_VERSION=1
