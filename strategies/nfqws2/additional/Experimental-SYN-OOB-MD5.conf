ISP_INTERFACE="eth3"
NFQWS_BASE_ARGS="--lua-init=@/opt/etc/nfqws2/lua/zapret-lib.lua
--lua-init=@/opt/etc/nfqws2/lua/zapret-antidpi.lua
--lua-init=@/opt/etc/nfqws2/lua/zapret-auto.lua
--blob=quic_initial:@/opt/etc/nfqws2/blobs/quic_initial.bin
--blob=tls_clienthello:@/opt/etc/nfqws2/blobs/tls_clienthello.bin"
MODE_LIST="--hostlist=/opt/etc/nfqws2/lists/user.list"
MODE_ALL="--hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list"
MODE_AUTO="$MODE_LIST
--hostlist-auto=/opt/etc/nfqws2/lists/auto.list
--hostlist-auto-debug=/opt/var/log/nfqws2.log
$MODE_ALL"
NFQWS_ARGS_IPSET="--ipset=/opt/etc/nfqws2/lists/ipset.list
--ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list"
NFQWS_ARGS="--filter-tcp=443,2053,2083,2087,2096,8443 --filter-l7=tls --payload=tls_client_hello
--lua-desync=circular:fails=2:time=180:retrans=3:nld=2:reset
--lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid:ip_autottl=-1,3-20:tcp_md5:strategy=1
--lua-desync=fakedsplit:pos=2:seqovl=5:seqovl_pattern=0x1603030000:tcp_md5:nodrop:strategy=2"
NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic --payload=quic_initial
--lua-desync=circular:fails=2:time=180:retrans=3:nld=2:reset
--lua-desync=fake:blob=quic_initial:repeats=6:strategy=1
--lua-desync=fake:blob=quic_initial:repeats=9:ip_autottl=-1,3-20:strategy=2
--lua-desync=fake:blob=quic_initial:repeats=12:ip_ttl=2:strategy=3"
NFQWS_ARGS_UDP="--filter-udp=3478-3481,5349 --filter-l7=stun --payload=stun
--lua-desync=circular:fails=2:time=180:retrans=3:nld=2:reset
--lua-desync=fake:blob=0x0000000000000000:repeats=1:strategy=1
--lua-desync=fake:blob=0x0000000000000000:repeats=2:ip_autottl=-1,3-20:strategy=2
--lua-desync=fake:blob=0x00000000000000000000000000000000:repeats=4:strategy=3"
NFQWS_EXTRA_ARGS="$MODE_LIST"
NFQWS_ARGS_CUSTOM="--filter-tcp=443 --filter-l7=tls --payload=tls_client_hello
--lua-desync=circular:fails=2:time=180:retrans=3:nld=2:reset
--lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid:ip_autottl=-1,3-20:tcp_md5:repeats=2:strategy=1
--new
--filter-tcp=80 --filter-l7=http --payload=http_req
--lua-desync=circular:fails=2:time=180:retrans=3:nld=2:reset
--lua-desync=fakedsplit:pos=method+2:ip_autottl=-1,3-20:tcp_md5:strategy=1
--lua-desync=send:tcp_md5:strategy=2
--lua-desync=fake:blob=fake_default_http:tcp_md5:strategy=3
--new
--filter-tcp=80 --filter-l7=http --payload=http_req
--lua-desync=circular:fails=2:time=180:retrans=3:nld=2:reset
--lua-desync=fakedsplit:pos=method+2:ip_autottl=-1,3-20:tcp_md5:strategy=1
--lua-desync=fake:blob=fake_default_http:tcp_md5:strategy=2"
IPV6_ENABLED="0"
TCP_PORTS="443,2053,2083,2087,2096,8443,80"
UDP_PORTS="443,3478:3481,5349"
POLICY_NAME="nfqws"
POLICY_EXCLUDE="0"
