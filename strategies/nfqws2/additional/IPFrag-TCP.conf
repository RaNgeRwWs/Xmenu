ISP_INTERFACE="eth3"
NFQWS_BASE_ARGS="--lua-init=@/opt/etc/nfqws2/lua/zapret-lib.lua
--lua-init=@/opt/etc/nfqws2/lua/zapret-antidpi.lua
--lua-init=@/opt/etc/nfqws2/lua/zapret-auto.lua
--blob=quic_initial:@/opt/etc/nfqws2/blobs/quic_initial.bin
--blob=tls_clienthello:@/opt/etc/nfqws2/blobs/tls_clienthello.bin"
MODE_LIST="--hostlist=/opt/etc/nfqws2/lists/user.list"
MODE_ALL="--hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list"
NFQWS_ARGS="--filter-tcp=443
--filter-l7=tls
--payload=tls_client_hello
--lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid:ip_autottl=-1,3-20:strategy=1
--lua-desync=send:ipfrag:ipfrag_pos_tcp=32:strategy=2
--lua-desync=drop:payload=known:strategy=2
--lua-desync=multisplit:pos=midsld:strategy=3"
NFQWS_ARGS_QUIC="--filter-udp=443
--filter-l7=quic
--payload=quic_initial
--lua-desync=fake:blob=quic_initial:repeats=3"
NFQWS_ARGS_UDP="--filter-udp=590-600,1400,3478-3481,5349,19294-19344,49152-65535
--filter-l7=wireguard,stun,discord,mtproto,unknown
--payload=wireguard_initiation,wireguard_response,wireguard_cookie,stun,discord_ip_discovery,mtproto_initial,unknown
--lua-desync=fake:blob=0x00000000:repeats=2"
NFQWS_EXTRA_ARGS="$MODE_LIST"
NFQWS_ARGS_IPSET="--ipset=/opt/etc/nfqws2/lists/ipset.list
--ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list"
NFQWS_ARGS_CUSTOM="--filter-tcp=443
--filter-l7=tls
--payload=tls_client_hello
--lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid:strategy=1
--lua-desync=send:ipfrag:ipfrag_pos_tcp=32:strategy=2
--lua-desync=drop:payload=known:strategy=2"
IPV6_ENABLED="0"
TCP_PORTS="443"
UDP_PORTS="443,590:600,1400,3478:3481,5349,19294:19344,49152:65535"
POLICY_NAME="nfqws"
POLICY_EXCLUDE="0"
LOG_LEVEL="0"
NFQUEUE_NUM="300"
USER="nobody"
CONFIG_VERSION="3"
