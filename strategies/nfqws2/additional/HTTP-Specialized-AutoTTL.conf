ISP_INTERFACE="eth3"
NFQWS_BASE_ARGS="--lua-init=@/opt/etc/nfqws2/lua/zapret-lib.lua
--lua-init=@/opt/etc/nfqws2/lua/zapret-antidpi.lua
--lua-init=@/opt/etc/nfqws2/lua/zapret-auto.lua
--blob=quic_initial:@/opt/etc/nfqws2/blobs/quic_initial.bin
--blob=tls_clienthello:@/opt/etc/nfqws2/blobs/tls_clienthello.bin"
MODE_LIST="--hostlist=/opt/etc/nfqws2/lists/user.list"
MODE_ALL="--hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list"
MODE_AUTO="$MODE_LIST
--hostlist-auto=/opt/etc/nfqws2/lists/auto.list
--hostlist-auto-debug=/opt/var/log/nfqws2.log
$MODE_ALL"
NFQWS_ARGS_IPSET="--ipset=/opt/etc/nfqws2/lists/ipset.list
--ipset-exclude=/opt/etc/nfqws2/lists/ipset_exclude.list"
NFQWS_ARGS="--filter-tcp=80 --filter-l7=http --payload=http_req
--lua-desync=circular:fails=1:time=45:retrans=2:nld=2:reset
--lua-desync=fake:blob=fake_default_http:ip_autottl=-1,3-20:strategy=1
--lua-desync=fakedsplit:pos=method+2:ip_autottl=-1,3-20:strategy=2
--lua-desync=fakedsplit:pos=method+2:ip_autottl=-2,3-20:tcp_md5:strategy=3"
NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic --payload=quic_initial
--lua-desync=circular:fails=1:time=45:retrans=2:nld=2:reset
--lua-desync=fake:blob=quic_initial:repeats=3:strategy=1
--lua-desync=fake:blob=quic_initial:repeats=5:ip_autottl=-1,3-20:strategy=2
--lua-desync=fake:blob=quic_initial:repeats=7:ip_ttl=3:strategy=3"
NFQWS_ARGS_UDP="--filter-udp=3478-3481,5349 --filter-l7=stun --payload=stun
--lua-desync=circular:fails=1:time=45:retrans=2:nld=2:reset
--lua-desync=fake:blob=0x0000000000000000:repeats=1:strategy=1
--lua-desync=fake:blob=0x0000000000000000:repeats=2:ip_autottl=-1,3-20:strategy=2
--lua-desync=fake:blob=0x0000000000000000:repeats=3:ip_ttl=3:strategy=3"
NFQWS_EXTRA_ARGS="$MODE_LIST"
NFQWS_ARGS_CUSTOM="--filter-tcp=80 --filter-l7=http --payload=http_req
--lua-desync=circular:fails=1:time=45:retrans=2:nld=2:reset
--lua-desync=fake:blob=fake_default_http:ip_autottl=-1,3-20:tcp_md5:strategy=1
--lua-desync=fakedsplit:pos=method+2:ip_autottl=-1,3-20:strategy=2
--lua-desync=fakedsplit:pos=method+2:ip_autottl=-2,3-20:tcp_md5:strategy=3
--new
--filter-tcp=443 --filter-l7=tls --payload=tls_client_hello
--lua-desync=circular:fails=1:time=45:retrans=2:nld=2:reset
--lua-desync=fakeddisorder:pos=midsld:strategy=1
--lua-desync=multisplit:pos=1,midsld:seqovl=1:seqovl_pattern=tls_clienthello:strategy=2
--lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid:ip_autottl=-1,3-20:strategy=3
--new
--filter-tcp=443 --filter-l7=tls --payload=tls_client_hello
--lua-desync=circular:fails=1:time=45:retrans=2:nld=2:reset
--lua-desync=multisplit:pos=1,midsld:strategy=1
--lua-desync=fakeddisorder:pos=midsld:ip_autottl=-1,3-20:strategy=2
--lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid:ip_autottl=-1,3-20:strategy=3"
IPV6_ENABLED="0"
TCP_PORTS="80,443"
UDP_PORTS="443,3478:3481,5349"
POLICY_NAME="nfqws"
POLICY_EXCLUDE="0"
LOG_LEVEL="0"
NFQUEUE_NUM="300"
USER="nobody"
CONFIG_VERSION="1"
